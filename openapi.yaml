openapi: 3.1.0
info:
  title: Афиша MAX — API
  description: Бэкенд мини-приложения и чат-бота афиши с умным подбором событий.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - service
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /api/v1/cities:
    get:
      tags:
      - catalog
      summary: List Cities
      operationId: list_cities_api_v1_cities_get
