  /api/v1/events:
    get:
      tags:
      - events
      summary: List Events
      operationId: list_events_api_v1_events_get
      parameters:
      - name: city_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: По умолчанию — город пользователя
          title: City Id
        description: По умолчанию — город пользователя
      - name: category
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Слаги категорий
          title: Category
        description: Слаги категорий
      - name: tag
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Tag
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Date To
      - name: price_max
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Price Max
      - name: free
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Free
      - name: pushkin_card
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Pushkin Card
      - name: max_age
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 21
            minimum: 0
          - type: 'null'
          description: Возрастное ограничение не выше
          title: Max Age
        description: Возрастное ограничение не выше
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Поиск по названию и описанию
          title: Q
        description: Поиск по названию и описанию
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: x-max-init-data
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: window.WebApp.initData
          title: X-Max-Init-Data
        description: window.WebApp.initData
      - name: x-dev-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Только при DEV_AUTH_ENABLED
          title: X-Dev-User-Id
        description: Только при DEV_AUTH_ENABLED
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_EventOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
