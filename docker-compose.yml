name: afisha-max

# Общие настройки для api и bot: один образ, одна конфигурация.
# Значения берутся из .env (см. .env.example); без него работают безопасные умолчания.
x-backend: &backend
  build: ./backend
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-afisha}:${POSTGRES_PASSWORD:-afisha}@db:5432/${POSTGRES_DB:-afisha}
    TIMEZONE: ${TIMEZONE:-Europe/Moscow}
    DEFAULT_CITY: ${DEFAULT_CITY:-Санкт-Петербург}
    SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    CORS_ORIGINS: ${CORS_ORIGINS:-*}
    DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    INIT_DATA_TTL_SECONDS: ${INIT_DATA_TTL_SECONDS:-86400}
    REMINDER_POLL_INTERVAL_SECONDS: ${REMINDER_POLL_INTERVAL_SECONDS:-30}
    MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
    MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
    MAX_API_URL: ${MAX_API_URL:-https://platform-api2.max.ru}
    MAX_CA_BUNDLE: ${MAX_CA_BUNDLE:-}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  extra_hosts:
    - "host.docker.internal:host-gateway" # доступ к Ollama на хост-машине (на Windows/Mac уже есть)
  volumes:
    - ./certs:/certs:ro # корневой сертификат для MAX API, если нужен (см. README)
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afisha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afisha}
      POSTGRES_DB: ${POSTGRES_DB:-afisha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432" # только с локальной машины, для отладки
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afisha} -d ${POSTGRES_DB:-afisha}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # HTTP API для мини-приложения. Перед стартом применяет миграции и загружает справочники/демо-данные.
  api:
    <<: *backend
    command: >
      sh -c "alembic upgrade head
      && python -m app.seed
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Чат-бот MAX: long polling + рассылка напоминаний. Стартует после api (миграции уже применены).
  bot:
    <<: *backend
    command: python -m app.bot
    restart: on-failure # без MAX_BOT_TOKEN бот штатно завершается и не перезапускается
    depends_on:
      api:
        condition: service_healthy

  # Мини-приложение: статика + прокси /api на api. Публичный HTTPS-адрес этого сервиса указывается в MAX.
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
